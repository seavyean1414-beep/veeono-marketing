<style>
:root{--bg:#050506;--c1:#18181B;--c2:#0A0A0B;--ln:rgba(255,255,255,.1);--tx:#F4F4F5;--mute:#8E8E96;--w:#F4F4F5;
--ui:'Inter Tight','Kantumruy Pro',sans-serif;--body:'Kantumruy Pro','Inter Tight',sans-serif;--mono:'JetBrains Mono',monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.75 var(--body);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
section{padding:96px 0;position:relative}
h1,h2,h3{font-family:var(--ui);margin:0;font-weight:500;letter-spacing:-.025em}
h2{font-size:clamp(30px,4vw,48px);line-height:1.2;background:linear-gradient(180deg,rgba(255,255,255,.32) 0,#fff 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 8px;border-radius:999px;border:1px solid var(--ln);background:rgba(255,255,255,.04);font:500 12.5px var(--ui);color:#D4D4D8}
.pill b{width:18px;height:18px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#000}.pill b .i{width:10px;height:10px;stroke-width:2.4}
.sh{margin-bottom:44px;max-width:560px}.sh h2{margin:16px 0 12px}.sh p{margin:0;color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;border:1px solid transparent;background:var(--w);color:#09090B;font:600 14px var(--ui);box-shadow:0 0 30px -8px rgba(255,255,255,.5)}
.btn:hover{background:#fff}
.btn.d{background:linear-gradient(180deg,#26262A,#17171A);border-color:var(--ln);color:#fff;box-shadow:none}.btn.d:hover{border-color:rgba(255,255,255,.3)}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(5,5,6,.75);backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.top img{height:22px;display:block}
.nav{display:flex;gap:6px;margin:0 auto}
.nav a{padding:6px 14px;border-radius:8px;font:500 14px var(--ui);color:var(--mute)}
.nav a:hover,.nav a.on{color:#fff;background:rgba(255,255,255,.07)}
.lang{display:flex;border:1px solid var(--ln);border-radius:9px;padding:2px}
.lang button{background:none;border:0;border-radius:7px;padding:4px 11px;font:600 12.5px var(--ui);color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--w);color:#000}
.top .btn{padding:7px 16px;font-size:13.5px}
/* hero */
.hero{padding:88px 0 64px;background:radial-gradient(800px 420px at 70% 0,rgba(255,255,255,.1),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/84px 84px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/84px 84px}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:160px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.hero .wrap{position:relative;z-index:1}
h1{font-size:clamp(40px,6.4vw,84px);line-height:1.12;max-width:11em;margin:22px 0 20px;background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:30em;color:var(--mute);font-size:17px;margin:0 0 30px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.star{position:absolute;filter:drop-shadow(0 20px 30px rgba(0,0,0,.8))}
.s1{right:14%;top:-10px;width:clamp(90px,13vw,170px)}.s2{right:2%;top:96px;width:clamp(120px,19vw,250px)}.s3{right:6%;top:330px;width:clamp(40px,6vw,80px)}
/* marquee */
.mq{padding:8px 0 56px;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mt{display:flex;gap:56px;width:max-content;animation:mv 40s linear infinite}
.mt span{display:inline-flex;align-items:center;gap:10px;font:600 17px var(--ui);color:#D4D4D8;white-space:nowrap}
@keyframes mv{to{transform:translateX(-50%)}}
/* bento */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.bc{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--ln);background:linear-gradient(165deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.08);padding:26px;min-height:270px}
.bc h3{font-size:16px;font-weight:600;margin-bottom:4px}.bc p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.6}
.a{grid-column:span 7}.b{grid-column:span 5}.c{grid-column:span 5}.dd{grid-column:span 7}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.tags button{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--ln);background:linear-gradient(180deg,#232327,#141416);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 16px -8px #000;font:500 13.5px var(--ui)}
.tags button:hover{border-color:rgba(255,255,255,.4)}
.dev{position:absolute;right:-24px;bottom:-30px;width:78%;height:78%;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:#0B0B0D;transform:rotate(-5deg);padding:16px 20px;overflow:hidden;box-shadow:0 30px 60px -20px #000}
.dev .doc{padding:0;max-height:none;overflow:hidden}.dev .doc h1{font-size:15px;margin:0 0 8px;-webkit-text-fill-color:#fff;background:none;max-width:none}.dev .doc h2{font-size:12px;margin:10px 0 4px;-webkit-text-fill-color:#BDBDC4;background:none}.dev .doc p,.dev .doc li{font-size:11.5px;line-height:1.6;margin:0 0 4px}
.c{background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 22px,transparent 22px 44px),linear-gradient(165deg,var(--c1),var(--c2))}
.big{display:flex;gap:10px;margin:22px 0 0}

const ICO={home:'M3 11l9-8 9 8M5 10v10h14V10',book:'M4 5h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v13h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4z',edit:'M4 20l4-1 11-11-3-3L5 16z',phone:'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',copy:'M9 9h11v11H9zM5 15V4h11',download:'M12 4v11m0 0-4-4m4 4 4-4M5 20h14',left:'m15 6-6 6 6 6',right:'m9 6 6 6-6 6',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',code:'m8 8-5 4 5 4M16 8l5 4-5 4M14 5l-4 14',file:'M6 3h9l4 4v14H6zM14 3v5h5',grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',arrow:'M5 12h14m-5-5 5 5-5 5'};
const TI={ads:'M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1zM17 9a4 4 0 0 1 0 6',brand:'M12 3a9 9 0 1 0 0 18c1.6 0 2-1.2 1.4-2.2s-.2-2.3 1.4-2.3H17a4 4 0 0 0 4-4 9 9 0 0 0-9-9.5zM7.5 11h.01M10 7.5h.01M15 7.5h.01',video:P[2],ai:'M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3M7 6h10v12H7zM10 10h4v4h-4z'};
const SI={s1:ICO.grid,s2:ICO.file,s3:ICO.layers,s4:ICO.globe};
let lang='km',idx=0,edKey='ads',dirty=false,filter='';
try{const s=localStorage.getItem('veeono-lang');if(s==='en'||s==='km')lang=s}catch(e){}
const tr=k=>T[lang][k],docs=()=>lang==='en'?docsEn:mdDocs,cur=()=>docs()[cats[idx][0]],tp=k=>(lang==='en'?tplEn:templates)[k];
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function go(i){pick(i);$('learn').scrollIntoView({behavior:'smooth'})}
function drawChips(){const q=filter.trim().toLowerCase();
$('chips').innerHTML=cats.map((c,i)=>[c,i]).filter(([c])=>!q||(c[1]+c[2]+c[3]).toLowerCase().includes(q)).map(([c,i])=>'<button aria-current="'+(i===idx)+'" onclick="pick('+i+')">'+sv(P[i])+c[1]+'</button>').join('')||'<p>'+tr('none')+'</p>'}
function drawStatic(){const d=docs();
$('tags').innerHTML=cats.map((c,i)=>'<button onclick="go('+i+')">'+sv(P[i])+c[1]+'</button>').join('');
const m=cats.map((c,i)=>'<span>'+sv(P[i])+c[1]+'</span>').join('');$('mq').innerHTML=m+m;
$('hdoc').innerHTML=parse(d.marketing.raw.split('\n').slice(0,9).join('\n'));
$('files').innerHTML=[0,1,2].map(i=>'<button onclick="go('+i+')"><span class="ic sm">'+sv(P[i])+'</span><span>'+d[cats[i][0]].file+'<small>'+cats[i][1]+'</small></span></button>').join('');
$('tilt').innerHTML=[[cats.length,'s1'],[Object.keys(mdDocs).length,'s2'],[Object.keys(tplNames).length,'s3'],[2,'s4']].map(a=>'<div><span class="ic">'+sv(SI[a[1]])+'</span><b>'+a[0]+'</b><span>'+tr(a[1])+'</span></div>').join('');
$('bk').setAttribute('aria-pressed',lang==='km');$('be').setAttribute('aria-pressed',lang==='en')}
function render(){const d=cur();$('rhic').innerHTML=sv(P[idx]);$('rht').textContent=cats[idx][1];$('rhd').textContent=lang==='en'?cats[idx][3]:cats[idx][2];$('cnt').textContent=(idx+1)+' / '+cats.length;$('fname').textContent=d.file;$('doc').innerHTML=parse(d.raw);$('raw').textContent=d.raw;drawChips()}
function pick(i){idx=i;render();$('doc').scrollTop=0;$('raw').scrollTop=0}
function step(d){pick((idx+d+cats.length)%cats.length)}
function setMode(m){const p=m==='preview';$('doc').hidden=!p;$('raw').hidden=p;$('bp').setAttribute('aria-pressed',p);$('br').setAttribute('aria-pressed',!p)}
function copyMd(){const t=cur().raw;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(tr('copied')),()=>toast(tr('copyFail')))}
function live(){$('live').innerHTML=parse($('src').value)}
const tplNames={ads:'Ad Campaign Brief',brand:'Design System Spec',video:'Video Edit Runsheet',ai:'AI Prompt Log'};
function tabs(){$('tabs').innerHTML=Object.keys(tplNames).map(k=>{const ls=tp(k).split('\n').filter(l=>l.startsWith('- ')).slice(0,3).map(l=>'<li>'+sv(CK)+'<span>'+l.slice(2).replace(/\*\*/g,'')+'</span></li>').join('');
return '<div class="tcard" role="button" tabindex="0" aria-pressed="'+(k===edKey)+'" onclick="tpl(\''+k+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();tpl(\''+k+'\')}"><span class="ic">'+sv(TI[k])+'</span><h3>'+tplNames[k]+'</h3><ul>'+ls+'</ul><span class="btn">'+tr('useTpl')+'</span></div>'}).join('')}
function tpl(k){edKey=k;dirty=false;$('src').value=tp(k);live();tabs()}
function download(){const b=new Blob([$('src').value],{type:'text/markdown'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='veeono-note.md';a.click();toast(tr('dled'))}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=tr(e.dataset.i));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=tr(e.dataset.ph));
document.querySelectorAll('[data-ic],[data-ia]').forEach(e=>{if(e.dataset.ic){const g=sv(ICO[e.dataset.ic]);e.innerHTML=(e.hasAttribute('data-tile')?'<span class="ic">'+g+'</span>':g)+e.innerHTML}if(e.dataset.ia)e.innerHTML+=sv(ICO[e.dataset.ia])});
$('lk').setAttribute('aria-pressed',lang==='km');$('le').setAttribute('aria-pressed',lang==='en');
if(!dirty){$('src').value=tp(edKey);live()}render();tabs();drawStatic()}
function setLang(l){lang=l;try{localStorage.setItem('veeono-lang',l)}catch(e){}applyLang()}
$('q').addEventListener('input',e=>{filter=e.target.value;drawChips()});
$('src').addEventListener('input',()=>{dirty=true;live()});
function shareSite(){const u=location.href,d={title:document.title,url:u};if(navigator.share){navigator.share(d).catch(()=>{})}else{(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(tr('copied')),()=>toast(tr('copyFail')))}}
document.addEventListener('click',e=>{if(e.target.closest('a[href="#"]'))e.preventDefault()});
applyLang();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-40% 0px -55% 0px'});
['home','learn','try','contact'].forEach(id=>io.observe($(id)));
const mb=$('mb'),nv=$('nav');
function menu(o){nv.classList.toggle('open',o);mb.setAttribute('aria-expanded',o)}
mb.addEventListener('click',()=>menu(!nv.classList.contains('open')));
nv.addEventListener('click',e=>{if(e.target.closest('a'))menu(false)});
addEventListener('resize',()=>{if(innerWidth>900)menu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
</script></body></html>
